services:
  - type: web
    name: ledgerlens-api
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_API_KEY
        sync: false
      - key: REVIEWER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CHAT_MODEL
        value: gpt-6-luna
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
