services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATA_DIR: /var/data
    volumes: ["ledger-data:/var/data"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ledger-data:
