[project]
name = "ledgerlens"
version = "0.1.0"
description = "Evidence-first accounting document assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "openai>=2,<3", "pymupdf>=1.25,<2", "sqlite-vec>=0.1.6,<0.2",
  "tiktoken>=0.9,<1", "structlog>=25,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "reportlab>=4,<5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [".venv", "dist"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "sqlite_vec.*", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.extract", "scripts.generate_samples"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
